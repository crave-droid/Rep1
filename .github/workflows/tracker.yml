name: Run LJbot Tracker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 requests

    - name: Inline Execution Override
      run: |
        python -c "
        import requests
        from bs4 import BeautifulSoup

        MODEL_URL = 'https://imlive.com/live-sex-chat/cam-girls/laurajones0/'
        TELEGRAM_TOKEN = '8667818371:AAGZiEu5LK3KjFnWztw9kfRfPn--8EkJu7E'
        TELEGRAM_CHAT_ID = 410050399

        def send_alert(msg):
            url = f'https://telegram.org{TELEGRAM_TOKEN}/sendMessage'
            payload = {'chat_id': TELEGRAM_CHAT_ID, 'text': msg}
            res = requests.post(url, json=payload, timeout=10)
            print('Telegram status response:', res.status_code)

        try:
            headers = {'User-Agent': 'Mozilla/5.0'}
            req = requests.get(MODEL_URL, headers=headers, timeout=10)
            soup = BeautifulSoup(req.text, 'html.parser')
            text = soup.get_text().lower()
            
            if 'currently offline' in text:
                print('Status evaluated: Offline')
            elif 'online' in text or 'chat now' in text:
                print('Status evaluated: Online!')
                send_alert('LJ is online!')
            else:
                print('Status unknown, sending test alert anyway')
                send_alert('Tracker test alert payload triggered!')
        except Exception as e:
            print('Execution failure:', e)
        "
